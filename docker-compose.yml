services:
  db:
    image: postgres:16-alpine
    container_name: paylite-db
    environment:
      POSTGRES_DB: paylite
      POSTGRES_USER: paylite
      POSTGRES_PASSWORD: paylite
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55432:5432"
    volumes:
      - paylite-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylite -d paylite"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  paylite-db-data:
