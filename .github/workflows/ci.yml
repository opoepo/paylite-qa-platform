name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests (Java + RestAssured)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile, start the stack and run the API tests
        run: make test

      - name: Collect service and database logs
        if: always()
        run: docker compose logs --no-color sut db > compose.log

      - name: Show logs on failure
        if: failure()
        run: cat compose.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            tests-java/target/surefire-reports/
            compose.log
          retention-days: 14

      - name: Generate Allure report
        if: always()
        run: make report

      - name: Upload Allure report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: tests-java/target/site/allure-maven-plugin

  publish-report:
    name: Publish Allure report
    needs: api-tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
