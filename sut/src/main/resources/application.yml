spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/paylite}
    username: ${DATABASE_USER:paylite}
    password: ${DATABASE_PASSWORD:paylite}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO
    io.paylite: DEBUG
