services:
  db:
    image: postgres:16-alpine
    container_name: paylite-db
    environment:
      POSTGRES_DB: paylite
      POSTGRES_USER: paylite
      POSTGRES_PASSWORD: paylite
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55432:5432"
    volumes:
      - paylite-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylite -d paylite"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  sut:
    build: ./sut
    image: paylite-sut:local
    container_name: paylite-sut
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/paylite
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  tests:
    image: maven:3.9-eclipse-temurin-21
    container_name: paylite-tests
    depends_on:
      sut:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./tests-java:/workspace
      - maven-repo:/root/.m2
    environment:
      PAYLITE_BASE_URL: http://sut:8080
    command: [ "mvn", "-B", "-ntp", "test" ]
volumes:
  paylite-db-data:
  maven-repo: