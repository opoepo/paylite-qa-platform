name: Hello Runner

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  inspect:
    name: Inspect the runner
    runs-on: ubuntu-24.04

    steps:
      - name: Java before we do anything
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java after setup-java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show what we have
        run: ls -la
