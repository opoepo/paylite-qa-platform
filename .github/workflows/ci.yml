name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests (Java + RestAssured)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile, start the stack and run the API tests
        run: make test

      - name: Collect service and database logs
        if: always()
        run: docker compose logs --no-color sut db > compose.log

      - name: Show logs on failure
        if: failure()
        run: cat compose.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            tests-java/target/surefire-reports/
            compose.log
          retention-days: 14
